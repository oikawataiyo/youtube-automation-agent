<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06080D; --slate:#3A4A63; --ground:#1A2233; --sky:#0C111B;
    --amber:#E8A33D; --white:#F2F4F8;
  }
  html,body{margin:0;padding:0;}
  #stage{
    position:relative; width:2560px; height:1440px; overflow:hidden;
    background:var(--bg); font-family:"Inter",system-ui,sans-serif;
  }
  /* background bloom layers (radial, no banding) */
  .bloom{position:absolute; pointer-events:none;}
  .bloom-main{
    left:38%; top:42%; width:1700px; height:1700px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,#16243B 0%,#0C1422 45%,rgba(6,8,13,0) 75%);
    opacity:.9;
  }
  .bloom-right{
    right:-360px; top:50%; width:1500px; height:1500px; transform:translateY(-50%);
    background:radial-gradient(closest-side,#13233C 0%,#0B1320 50%,rgba(6,8,13,0) 75%);
    opacity:.45;
  }
  /* the 3D orb bleeding off the right edge (desktop/TV only) — dim, decorative */
  .orb{position:absolute; right:-340px; top:50%; transform:translateY(-50%);
       width:1180px; height:1180px; border-radius:50%; opacity:.62;
       background:
         radial-gradient(120% 120% at 34% 30%, #223349 0%, #131F31 24%, #0B121D 50%, #070B12 72%, #05070C 100%);
       box-shadow: inset 40px 30px 120px rgba(0,0,0,.65), inset -30px -20px 90px rgba(0,0,0,.75);
  }
  .orb-rim{position:absolute; right:-340px; top:50%; transform:translateY(-50%);
       width:1180px; height:1180px; border-radius:50%; opacity:.55;
       background:radial-gradient(120% 120% at 34% 28%, rgba(120,165,225,.38) 0%, rgba(120,165,225,0) 25%);
       mix-blend-mode:screen; }

  /* all-device safe area: 1546 x 423, centered */
  .safe{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1546px; height:423px;
    display:flex; align-items:center; justify-content:center;
  }
  .lockup{display:flex; align-items:center; gap:52px;}
  .mark{width:172px; height:172px; flex:0 0 auto;
        filter:drop-shadow(0 0 24px rgba(20,30,50,.6));}
  .type{display:flex; flex-direction:column; gap:18px;}
  .wordmark{
    font-family:"Space Grotesk",system-ui,sans-serif; font-weight:600;
    font-size:148px; line-height:.9; letter-spacing:-3px; color:var(--white);
    text-shadow:0 2px 30px rgba(0,0,0,.5);
  }
  .tagline{
    font-family:"Inter",system-ui,sans-serif; font-weight:400;
    font-size:44px; letter-spacing:.5px; color:#9FB0C7;
  }
  .tagline .amber{color:var(--amber); font-weight:500;}
</style>
</head>
<body>
<!--
  Autopilot — channel banner 2560x1440 (brand-spec §8)
  Center lockup lives in the all-device safe area (1546x423).
  Right orb bleeds outside it: shows on desktop/TV, cropped on mobile.
-->
<div id="stage">
  <div class="bloom bloom-main"></div>
  <div class="bloom bloom-right"></div>
  <div class="orb"></div>
  <div class="orb-rim"></div>
  <svg id="dust" width="2560" height="1440" style="position:absolute;inset:0;pointer-events:none"></svg>

  <div class="safe">
    <div class="lockup">
      <!-- clay chibi character head (matches profile) — transparent bg -->
      <svg class="mark" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="clay" cx="38%" cy="31%" r="74%">
            <stop offset="0%" stop-color="#F0CBA0"/>
            <stop offset="30%" stop-color="#E0B383"/>
            <stop offset="55%" stop-color="#CC9A68"/>
            <stop offset="76%" stop-color="#A9744A"/>
            <stop offset="92%" stop-color="#7C5234"/>
            <stop offset="100%" stop-color="#5E3D26"/>
          </radialGradient>
          <radialGradient id="rim" cx="76%" cy="80%" r="38%">
            <stop offset="0%" stop-color="#7E8CA0" stop-opacity="0.30"/>
            <stop offset="62%" stop-color="#7E8CA0" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="400" cy="400" r="332" fill="url(#clay)"/>
        <circle cx="400" cy="400" r="332" fill="url(#rim)"/>
        <ellipse cx="312" cy="420" rx="43" ry="54" fill="#241710"/>
        <ellipse cx="488" cy="420" rx="43" ry="54" fill="#241710"/>
        <ellipse cx="305" cy="398" rx="14" ry="17" fill="#4A3322" opacity="0.55"/>
        <ellipse cx="481" cy="398" rx="14" ry="17" fill="#4A3322" opacity="0.55"/>
      </svg>

      <div class="type">
        <div class="wordmark">Autopilot</div>
        <div class="tagline">See the brain on <span class="amber">autopilot</span>.</div>
      </div>
    </div>
  </div>

  <script>
    // deterministic star/particle dust (seeded — no Math.random)
    function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
    const rnd = mulberry32(0xA1170);
    const svg = document.getElementById('dust');
    const NS='http://www.w3.org/2000/svg';
    for(let i=0;i<150;i++){
      const x=rnd()*2560, y=rnd()*1440;
      const r=rnd()*1.6+0.4;
      const o=rnd()*0.5+0.06;
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',x.toFixed(1)); c.setAttribute('cy',y.toFixed(1));
      c.setAttribute('r',r.toFixed(2)); c.setAttribute('fill','#6E84A6');
      c.setAttribute('opacity',o.toFixed(2));
      svg.appendChild(c);
    }
  </script>
</div>
</body>
</html>
