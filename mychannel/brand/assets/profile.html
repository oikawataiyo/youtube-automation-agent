<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  #stage {
    width: 800px; height: 800px;
    background: #06080D;
  }
  svg { display: block; }
</style>
</head>
<body>
<div id="stage">
<!--
  Autopilot — profile picture
  Attitude indicator (aviation autopilot artificial horizon).
  Palette (brand-spec §8): bg #06080D · slate-blue #3A4A63 · ground #1A2233 · sky #0C111B · amber #E8A33D · white #F2F4F8
-->
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- subtle blue radial bloom behind the instrument (matches the 3D renders) -->
    <radialGradient id="bloom" cx="50%" cy="46%" r="55%">
      <stop offset="0%"  stop-color="#16243B" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0B1320" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06080D" stop-opacity="0"/>
    </radialGradient>
    <!-- ground hemisphere: a touch of depth -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#19222F"/>
      <stop offset="100%" stop-color="#11161F"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0D131D"/>
      <stop offset="100%" stop-color="#0B111B"/>
    </linearGradient>
    <!-- amber glow for the horizon + aircraft symbol -->
    <filter id="amberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="disc">
      <circle cx="400" cy="400" r="262"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="800" fill="#06080D"/>
  <circle cx="400" cy="372" r="430" fill="url(#bloom)"/>

  <!-- instrument scaled up to fill the circular avatar crop -->
  <g transform="translate(400 400) scale(1.22) translate(-400 -400)">

  <!-- gyro disc: sky over ground, split at the horizon (y=400) -->
  <g clip-path="url(#disc)">
    <rect x="138" y="138" width="524" height="262" fill="url(#skyGrad)"/>
    <rect x="138" y="400" width="524" height="262" fill="url(#groundGrad)"/>

    <!-- pitch ladder reference marks (slate-blue, subtle) -->
    <g stroke="#3A4A63" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="356" y1="350" x2="444" y2="350"/>
      <line x1="356" y1="450" x2="444" y2="450"/>
    </g>
  </g>

  <!-- horizon line (amber accent) — the element that must read at 24px -->
  <line x1="146" y1="400" x2="654" y2="400" stroke="#E8A33D" stroke-width="7"
        stroke-linecap="round" filter="url(#amberGlow)"/>
  <line x1="146" y1="400" x2="654" y2="400" stroke="#F4B656" stroke-width="3"
        stroke-linecap="round"/>

  <!-- fixed aircraft reference: triangle sitting apex-up on the horizon (amber) -->
  <path d="M400 332 L433 400 L367 400 Z" fill="#E8A33D" filter="url(#amberGlow)"/>

  <!-- bank index ticks around the upper rim (slate-blue, instrument detail) -->
  <g stroke="#3A4A63" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <!-- generated marks at -60..-10 and +10..+60 plus top -->
    <line x1="400" y1="138" x2="400" y2="160"/>
    <line x1="313.0" y1="161.3" x2="324.0" y2="180.3"/>
    <line x1="487.0" y1="161.3" x2="476.0" y2="180.3"/>
    <line x1="238.0" y1="211.0" x2="257.0" y2="222.0"/>
    <line x1="562.0" y1="211.0" x2="543.0" y2="222.0"/>
    <line x1="184.0" y1="283.0" x2="206.0" y2="294.0"/>
    <line x1="616.0" y1="283.0" x2="594.0" y2="294.0"/>
  </g>

  <!-- inner + outer rings (slate-blue bezel) -->
  <circle cx="400" cy="400" r="262" fill="none" stroke="#3A4A63" stroke-width="3" opacity="0.7"/>
  <circle cx="400" cy="400" r="278" fill="none" stroke="#2A3A4A" stroke-width="10"/>
  <circle cx="400" cy="400" r="278" fill="none" stroke="#3A4A63" stroke-width="6"/>
  <circle cx="400" cy="400" r="288" fill="none" stroke="#11161F" stroke-width="6"/>
  </g>
</svg>
</div>
</body>
</html>
