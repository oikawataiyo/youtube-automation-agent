<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  #stage { width: 800px; height: 800px; background: #06080D; }
  svg { display: block; }
</style>
</head>
<body>
<div id="stage">
<!--
  Autopilot — profile picture (v2)
  Face of the channel's two-head-tall clay chibi character (head + two dot eyes).
  Background per brand-spec §8 (#06080D + subtle bloom). Clay tone matches the 3D renders.
-->
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- brand bloom: cool base with a warm core so the clay head reads warm against near-black -->
    <radialGradient id="bloom" cx="50%" cy="44%" r="58%">
      <stop offset="0%"  stop-color="#241B16" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#121A26" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06080D" stop-opacity="0"/>
    </radialGradient>

    <!-- clay head: key light upper-left, terminator to warm shadow -->
    <radialGradient id="clay" cx="38%" cy="31%" r="74%">
      <stop offset="0%"  stop-color="#F0CBA0"/>
      <stop offset="30%" stop-color="#E0B383"/>
      <stop offset="55%" stop-color="#CC9A68"/>
      <stop offset="76%" stop-color="#A9744A"/>
      <stop offset="92%" stop-color="#7C5234"/>
      <stop offset="100%" stop-color="#5E3D26"/>
    </radialGradient>
    <!-- cool bounce/rim on the lower-right (matches render fill light) -->
    <radialGradient id="rim" cx="76%" cy="80%" r="38%">
      <stop offset="0%"  stop-color="#7E8CA0" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#7E8CA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shoulder" cx="42%" cy="30%" r="90%">
      <stop offset="0%"  stop-color="#C99868"/>
      <stop offset="60%" stop-color="#9A6A41"/>
      <stop offset="100%" stop-color="#5A3A24"/>
    </radialGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="800" fill="#06080D"/>
  <circle cx="400" cy="392" r="450" fill="url(#bloom)"/>

  <!-- contact shadow under the head -->
  <ellipse cx="400" cy="732" rx="210" ry="48" fill="url(#contact)"/>

  <!-- head (fills the avatar) -->
  <circle cx="400" cy="400" r="332" fill="url(#clay)"/>
  <circle cx="400" cy="400" r="332" fill="url(#rim)"/>

  <!-- two dot eyes (matte dark clay) -->
  <ellipse cx="312" cy="420" rx="43" ry="54" fill="#241710"/>
  <ellipse cx="488" cy="420" rx="43" ry="54" fill="#241710"/>
  <!-- faint upper sheen so the eyes read as rounded, not flat -->
  <ellipse cx="305" cy="398" rx="14" ry="17" fill="#4A3322" opacity="0.55"/>
  <ellipse cx="481" cy="398" rx="14" ry="17" fill="#4A3322" opacity="0.55"/>
</svg>
</div>
</body>
</html>
