<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js",
          "roughjs": "https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.esm.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../assets/lib/scene-kit.js"></script>
    <script src="../assets/narration/seg-01-words.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #12161c;
        font-family: "Helvetica Neue", Arial, sans-serif; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 86% 80% at 50% 48%, transparent 44%, rgba(0,0,0,0.44) 100%); }
      #caps { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        width: 1480px; text-align: center; pointer-events: none; }
      .phrase { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0;
        font-weight: 400; font-size: 46px; line-height: 1.4; letter-spacing: 0.01em;
        color: #5b6472; text-shadow: 0 2px 24px rgba(0,0,0,0.85); }
      .phrase .w { color: #5b6472; }
    </style>
  </head>
  <body>
    <div id="seg01" data-composition-id="seg01" data-width="1920" data-height="1080" data-start="0" data-duration="121">
      <audio id="vo" data-start="0" data-duration="121" data-track-index="9"
             src="../assets/narration/seg-01.wav" data-volume="1"></audio>
      <canvas id="stage" class="clip" data-start="0" data-duration="121" data-track-index="0" width="1920" height="1080"></canvas>
      <div id="vignette"></div>
      <div id="caps" class="clip" data-start="0" data-duration="121" data-track-index="4"></div>
    </div>

    <script type="module">
      // seg-01 — silent dark hallway, every door closed. A red fire-alarm under
      // glass rings (bloom), firing before any fire. Push in: the alarm's red
      // pools in a dark eye. The alarm goes off before the fire.
      import * as THREE from "three";
      import { makeBloomComposer, makeNoise } from "../assets/lib/fx-kit.js";
      window.THREE = THREE;
      const SK = window.SceneKit;
      const V = THREE.Vector3;
      const END = 121;

      const canvas = document.getElementById("stage");
      const renderer = SK.makeRenderer(canvas);
      renderer.toneMappingExposure = 1.5;
      const scene = SK.makeScene(9, 30);
      scene.background = new THREE.Color(0x12161c);

      // ---- corridor: floor, ceiling, two walls, far end -----------------------
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x2e3742, roughness: 1 });
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a4250, roughness: 0.98 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 40), floorMat);
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(6, 40), new THREE.MeshStandardMaterial({ color: 0x252d36, roughness: 1 }));
      ceil.rotation.x = Math.PI / 2; ceil.position.y = 3.2; scene.add(ceil);
      const wallL = new THREE.Mesh(new THREE.PlaneGeometry(40, 3.2), wallMat);
      wallL.rotation.y = Math.PI / 2; wallL.position.set(-3, 1.6, -8); wallL.receiveShadow = true; scene.add(wallL);
      const wallR = new THREE.Mesh(new THREE.PlaneGeometry(40, 3.2), wallMat);
      wallR.rotation.y = -Math.PI / 2; wallR.position.set(3, 1.6, -8); wallR.receiveShadow = true; scene.add(wallR);
      const farWall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3.2), new THREE.MeshStandardMaterial({ color: 0x222a33, roughness: 1 }));
      farWall.position.set(0, 1.6, -22); scene.add(farWall);

      // closed doors down both walls (dark panels)
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x222a31, roughness: 0.9 });
      const handleMat = new THREE.MeshStandardMaterial({ color: 0x586374, roughness: 0.5, metalness: 0.4 });
      function makeDoor(x, z, faceRight) {
        const g = new THREE.Group();
        const panel = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.2, 1.1), doorMat);
        panel.castShadow = true; g.add(panel);
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), handleMat);
        knob.position.set(faceRight ? 0.08 : -0.08, 0, 0.42); g.add(knob);
        g.position.set(x, 1.2, z); scene.add(g);
      }
      for (let i = 0; i < 7; i++) {
        makeDoor(-2.95, -2 - i * 2.6, true);
        makeDoor(2.95, -3.3 - i * 2.6, false);
      }

      // ---- the alarm (right wall, mid-hall) under glass — bloom hero ----------
      const alarmZ = -6.5;
      const alarmBox = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.6, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x7a1410, roughness: 0.7 }));
      alarmBox.position.set(2.86, 1.9, alarmZ); scene.add(alarmBox);
      const alarmLens = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16),
        new THREE.MeshBasicMaterial({ color: 0xff2a18 }));
      alarmLens.position.set(2.74, 1.9, alarmZ); scene.add(alarmLens);
      const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.0),
        new THREE.MeshStandardMaterial({ color: 0x8fa6c0, roughness: 0.1, metalness: 0.2, transparent: true, opacity: 0.18 }));
      glass.rotation.y = -Math.PI / 2; glass.position.set(2.66, 1.9, alarmZ); scene.add(glass);
      const alarmLight = new THREE.PointLight(0xff3a22, 6, 9, 2);
      alarmLight.position.set(2.4, 1.9, alarmZ); scene.add(alarmLight);

      // the dark "eye" that the alarm's red pools into (final framing)
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 24),
        new THREE.MeshStandardMaterial({ color: 0x10131a, roughness: 0.22, metalness: 0.4 }));
      eye.position.set(1.9, 1.7, alarmZ + 1.3); scene.add(eye);

      // ---- lights -------------------------------------------------------------
      const key = SK.makeKeyLight();
      key.position.set(0, 4.0, -4); key.intensity = 0.9;
      scene.add(key);
      scene.add(new THREE.AmbientLight(0x4a586c, 1.0));
      scene.add(SK.makeFill(1.3));

      // ---- camera: 5 framings -------------------------------------------------
      const rig = SK.makeCameraRig([
        { pos: new V(0.0, 1.7, 3.2), posNear: new V(0.0, 1.7, 0.6), look: new V(0, 1.6, -10) },     // 0 hallway wide (push down hall)
        { pos: new V(1.1, 1.9, -4.4), look: new V(2.8, 1.9, alarmZ) },                               // 1 alarm medium
        { pos: new V(1.3, 1.98, alarmZ + 2.0), posNear: new V(1.7, 1.94, alarmZ + 1.3), look: new V(2.8, 1.9, alarmZ) }, // 2 alarm macro (pulled back)
        { pos: new V(-1.6, 1.8, -2.0), look: new V(2.4, 1.4, -10) },                                 // 3 doors row
        { pos: new V(0.7, 1.85, alarmZ + 2.9), posNear: new V(1.05, 1.8, alarmZ + 2.3), look: new V(1.9, 1.72, alarmZ + 1.2) }, // 4 eye (alarm rim-lights it)
      ], 40);
      const camera = rig.camera;

      const { composer, bloom } = makeBloomComposer(renderer, scene, camera,
        { strength: 0.8, radius: 0.6, threshold: 0.4 });
      const { noise2D } = makeNoise(23);

      // ---- ring pulse + render -----------------------------------------------
      const proxy = { t: 0 };
      const baseLensScale = 1.0;
      function render() {
        // alarm rings: deterministic pulse from proxy.t (sin, not a clock) + noise jitter
        const ring = 0.5 + 0.5 * Math.sin(proxy.t * 7.5);
        const jit = 0.5 + 0.5 * noise2D(proxy.t * 2.0, 0);
        const s = baseLensScale * (0.85 + ring * 0.45);
        alarmLens.scale.setScalar(s);
        alarmLight.intensity = 1.6 + ring * 2.4;
        bloom.strength = 0.55 + ring * 0.5 + jit * 0.1;
        rig.apply();
        composer.render();
      }
      render();

      const capHost = document.getElementById("caps");
      const phraseEls = SK.buildCaptions(window.seg01 || [], capHost);

      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.to(proxy, { t: END, duration: END, ease: "none" }, 0);

      // camera cuts (<=4s) · 0 hall · 1 alarm med · 2 alarm macro · 3 doors · 4 eye
      const cut = SK.makeCutter(tl, rig.state);
      cut.auto(0.0, 28, 4.0, [0, 3, 1], true);     // establish the silent hall, doors
      cut.auto(28, 70, 3.8, [1, 2, 0, 3], true);   // the alarm ringing before the fire
      cut.auto(70, 104, 3.8, [2, 1, 3], true);     // uncertainty / the alarm insists
      cut.auto(104, END, 4.0, [4, 2, 4], true);    // the red pools in the eye

      SK.wireCaptions(tl, phraseEls, END);
      window.__timelines = window.__timelines || {};
      window.__timelines["seg01"] = tl;
    </script>
  </body>
</html>
