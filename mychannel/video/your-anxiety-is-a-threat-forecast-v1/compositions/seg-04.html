<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js",
          "roughjs": "https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.esm.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../assets/lib/scene-kit.js"></script>
    <script src="../assets/narration/seg-04-words.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #12161c;
        font-family: "Helvetica Neue", Arial, sans-serif; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 86% 80% at 50% 48%, transparent 44%, rgba(0,0,0,0.44) 100%); }
      #caps { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        width: 1480px; text-align: center; pointer-events: none; }
      .phrase { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0;
        font-weight: 400; font-size: 46px; line-height: 1.4; letter-spacing: 0.01em;
        color: #5b6472; text-shadow: 0 2px 24px rgba(0,0,0,0.85); }
      .phrase .w { color: #5b6472; }
    </style>
  </head>
  <body>
    <div id="seg04" data-composition-id="seg04" data-width="1920" data-height="1080" data-start="0" data-duration="134">
      <audio id="vo" data-start="0" data-duration="134" data-track-index="9"
             src="../assets/narration/seg-04.wav" data-volume="1"></audio>
      <canvas id="stage" class="clip" data-start="0" data-duration="134" data-track-index="0" width="1920" height="1080"></canvas>
      <div id="vignette"></div>
      <div id="caps" class="clip" data-start="0" data-duration="134" data-track-index="4"></div>
    </div>

    <script type="module">
      // seg-04 — a night classroom. A notebook stamps "SAFE" (rough chalk) every
      // time a door shuts, while the blackboard still reads "DANGER" (rough chalk).
      // Avoidance teaches the wrong lesson: "avoided, therefore nothing happened."
      import * as THREE from "three";
      import { makeBloomComposer, mulberry32 } from "../assets/lib/fx-kit.js";
      import rough from "roughjs";
      window.THREE = THREE;
      const SK = window.SceneKit;
      const V = THREE.Vector3;
      const END = 134;

      // ---- shared chalk-text helper (seeded per-letter jitter) ---------------
      function chalkText(ctx, text, cx, cy, size, color, seed) {
        ctx.save();
        ctx.font = `bold ${size}px Georgia, "Times New Roman", serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = size * 0.14;
        const rng = mulberry32(seed);
        let total = 0; for (const ch of text) total += ctx.measureText(ch).width;
        let x = cx - total / 2;
        for (const ch of text) {
          const w = ctx.measureText(ch).width;
          ctx.save();
          ctx.translate(x + w / 2, cy + (rng() - 0.5) * size * 0.09);
          ctx.rotate((rng() - 0.5) * 0.07);
          ctx.globalAlpha = 0.78 + rng() * 0.2;
          ctx.fillText(ch, 0, 0);
          ctx.restore();
          x += w;
        }
        ctx.restore();
      }

      const canvas = document.getElementById("stage");
      const renderer = SK.makeRenderer(canvas);
      renderer.toneMappingExposure = 1.5;
      const scene = SK.makeScene(12, 34);
      scene.background = new THREE.Color(0x12161c);

      // ---- room ---------------------------------------------------------------
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24),
        new THREE.MeshStandardMaterial({ color: 0x39414e, roughness: 0.98 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 7),
        new THREE.MeshStandardMaterial({ color: 0x2c343f, roughness: 1 }));
      backWall.position.set(0, 2.6, -5); scene.add(backWall);
      const sideWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 7),
        new THREE.MeshStandardMaterial({ color: 0x2a313b, roughness: 1 }));
      sideWall.rotation.y = -Math.PI / 2; sideWall.position.set(4.2, 2.6, -1); scene.add(sideWall);

      // ---- blackboard with rough "DANGER" chalk ------------------------------
      const bc = document.createElement("canvas"); bc.width = 1600; bc.height = 800;
      const bx = bc.getContext("2d");
      bx.fillStyle = "#15241d"; bx.fillRect(0, 0, 1600, 800);
      const brc = rough.canvas(bc);
      brc.rectangle(40, 40, 1520, 720, { seed: 3, stroke: "#3a5447", strokeWidth: 6, roughness: 2.4 });
      chalkText(bx, "DANGER", 800, 360, 280, "#e6efe2", 41);
      brc.line(420, 540, 1180, 548, { seed: 9, stroke: "#cfe0cf", strokeWidth: 8, roughness: 2.6 });
      brc.line(440, 560, 1150, 566, { seed: 11, stroke: "#9fb6a4", strokeWidth: 4, roughness: 3.0 });
      const boardTex = new THREE.CanvasTexture(bc); boardTex.colorSpace = THREE.SRGBColorSpace;
      const board = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 2.6),
        new THREE.MeshStandardMaterial({ map: boardTex, roughness: 0.92 }));
      board.position.set(0, 2.5, -4.93); scene.add(board);

      // ---- desks (rows facing the board) -------------------------------------
      const deskMat = new THREE.MeshStandardMaterial({ color: 0x4a3f34, roughness: 0.8 });
      const legMat = new THREE.MeshStandardMaterial({ color: 0x2c2622, roughness: 0.9 });
      function makeDesk(x, z) {
        const g = new THREE.Group();
        const top = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.6), deskMat);
        top.position.y = 0.72; top.castShadow = true; top.receiveShadow = true; g.add(top);
        for (const sx of [-0.42, 0.42]) for (const sz of [-0.24, 0.24]) {
          const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.72, 0.06), legMat);
          leg.position.set(sx, 0.36, sz); g.add(leg);
        }
        g.position.set(x, 0, z); scene.add(g);
        return g;
      }
      for (let r = 0; r < 3; r++) for (let c = -1; c <= 1; c++) makeDesk(c * 1.5, -1.2 - r * 1.6);

      // front-center desk holds the notebook
      const frontDesk = makeDesk(0, 0.4);

      // ---- notebook + "SAFE" rough stamp -------------------------------------
      const nb = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.36),
        new THREE.MeshStandardMaterial({ color: 0xe8e2d2, roughness: 0.9 }));
      nb.position.set(0, 1.14, 0.4); scene.add(nb);
      const sc = document.createElement("canvas"); sc.width = 512; sc.height = 384;
      const sx2 = sc.getContext("2d");
      const src = rough.canvas(sc);
      src.rectangle(70, 110, 372, 170, { seed: 5, stroke: "#c8362a", strokeWidth: 10, roughness: 2.6 });
      chalkText(sx2, "SAFE", 256, 196, 150, "#d8463a", 17);
      const stampTex = new THREE.CanvasTexture(sc); stampTex.colorSpace = THREE.SRGBColorSpace;
      const stamp = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.34),
        new THREE.MeshBasicMaterial({ map: stampTex, transparent: true, opacity: 0 }));
      stamp.rotation.x = -Math.PI / 2; stamp.position.set(0, 1.17, 0.4); scene.add(stamp);

      // ---- swinging door on the side wall ------------------------------------
      const doorHinge = new THREE.Group(); doorHinge.position.set(4.1, 1.2, -0.6); scene.add(doorHinge);
      const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.3, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x3a3128, roughness: 0.85 }));
      doorPanel.position.set(0, 0, -0.6); doorPanel.castShadow = true; doorHinge.add(doorPanel);
      const moon = new THREE.PointLight(0x9fc0ff, 4, 9, 2); moon.position.set(3.4, 2.2, -0.6); scene.add(moon);

      // ---- lights -------------------------------------------------------------
      const key = SK.makeKeyLight(); key.position.set(-1.4, 4.2, 2.2); key.intensity = 0.85; scene.add(key);
      scene.add(new THREE.AmbientLight(0x4a586c, 1.0));
      scene.add(SK.makeFill(1.35));

      const rig = SK.makeCameraRig([
        { pos: new V(0.0, 2.7, 5.6), posNear: new V(0.0, 2.5, 4.4), look: new V(0, 1.7, -4.5) },   // 0 classroom wide
        { pos: new V(0.8, 1.7, 2.3), posNear: new V(0.5, 1.6, 1.7), look: new V(0, 1.12, 0.4) },   // 1 desk + notebook
        { pos: new V(0.25, 1.5, 1.1), posNear: new V(0.2, 1.42, 0.7), look: new V(0, 1.15, 0.4) }, // 2 SAFE stamp macro
        { pos: new V(0.0, 2.4, 0.8), posNear: new V(0.0, 2.45, -1.6), look: new V(0, 2.5, -4.9) }, // 3 blackboard DANGER
        { pos: new V(2.4, 1.8, 1.4), look: new V(4.1, 1.3, -0.8) },                                 // 4 door
      ], 40);
      const camera = rig.camera;

      const { composer, bloom } = makeBloomComposer(renderer, scene, camera,
        { strength: 0.55, radius: 0.6, threshold: 0.5 });

      // ---- door cycle + stamp flash ------------------------------------------
      const proxy = { t: 0, door: 0 };
      function render() {
        doorHinge.rotation.y = -1.15 * (1 - proxy.door); // 0 open .. 1 shut
        // SAFE stamps when the door is (near) shut
        const shut = Math.max(0, (proxy.door - 0.62) / 0.38);
        stamp.material.opacity = shut * shut;
        moon.intensity = 2.0 + (1 - proxy.door) * 4.0; // moonlight spills when open
        rig.apply();
        composer.render();
      }
      render();

      const capHost = document.getElementById("caps");
      const phraseEls = SK.buildCaptions(window.seg04 || [], capHost);

      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.to(proxy, { t: END, duration: END, ease: "none" }, 0);
      // door opens and shuts repeatedly; SAFE stamps on each shut (finite repeats)
      tl.to(proxy, { door: 1, duration: 5.5, ease: "power2.inOut", yoyo: true, repeat: 21 }, 2);

      const cut = SK.makeCutter(tl, rig.state);
      cut.auto(0.0, 30, 3.8, [0, 3, 1], true);      // the classroom, the standing DANGER
      cut.auto(30, 74, 3.6, [1, 2, 4, 0], true);    // each avoidance stamps SAFE
      cut.auto(74, 108, 3.6, [4, 2, 3, 1], true);   // the loop updates the wrong way
      cut.auto(108, END, 4.0, [3, 0, 2], true);      // avoided, therefore nothing happened

      SK.wireCaptions(tl, phraseEls, END);
      window.__timelines = window.__timelines || {};
      window.__timelines["seg04"] = tl;
    </script>
  </body>
</html>
