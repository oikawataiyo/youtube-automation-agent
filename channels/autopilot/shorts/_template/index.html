<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/narration/00-words.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #0b1018; font-family: "Helvetica Neue", Arial, sans-serif;
        --cold: #5fd0ff; --cold-deep: #2b5cc4; --warm: #ffb24c; --warm-hot: #ff8a3d;
        --ink: #f6f1e8; --dim: #5d6b80;
      }
      #root { position: absolute; inset: 0; overflow: hidden; }
      /* background layers */
      #bg { position: absolute; inset: 0; background:
        radial-gradient(120% 80% at 50% 18%, #16243b 0%, #0b1018 55%, #070a10 100%); }
      #glow { position: absolute; left: 50%; top: 34%; width: 1200px; height: 1200px;
        margin-left: -600px; margin-top: -600px; border-radius: 50%;
        background: radial-gradient(circle, rgba(95,208,255,0.34) 0%, rgba(95,208,255,0) 62%);
        filter: blur(8px); }
      #warmglow { position: absolute; left: 50%; top: 60%; width: 1300px; height: 1300px;
        margin-left: -650px; margin-top: -650px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, rgba(255,178,76,0.40) 0%, rgba(255,138,61,0) 60%);
        filter: blur(10px); }
      #scan { position: absolute; inset: 0; opacity: 0.06; pointer-events: none;
        background-image: repeating-linear-gradient(0deg, #ffffff 0, #ffffff 1px, transparent 2px, transparent 4px); }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 65% at 50% 42%, transparent 42%, rgba(0,0,0,0.62) 100%); }
      .particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #9fc6ff; opacity: 0.35; }

      /* kicker + caption */
      #kicker { position: absolute; top: 300px; left: 0; right: 0; text-align: center;
        font-size: 30px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--cold);
        opacity: 0; font-weight: 700; }
      #stage { position: absolute; left: 90px; right: 90px; top: 640px; height: 640px; }
      .chunk { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
        text-align: center; opacity: 0; }
      .chunk .w { display: inline-block; margin: 4px 11px; font-size: 92px; line-height: 1.12;
        font-weight: 800; color: var(--dim); letter-spacing: -0.5px; transform-origin: center bottom; }
      .chunk .w.lead { font-size: 104px; }
      #progress { position: absolute; left: 90px; right: 90px; bottom: 230px; height: 6px;
        background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
      #progressfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
        background: linear-gradient(90deg, var(--cold), var(--warm)); }
      #handle { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center;
        font-size: 30px; letter-spacing: 0.12em; color: var(--dim); opacity: 0.0; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main">
      <div id="bg"></div>
      <div id="glow"></div>
      <div id="warmglow"></div>
      <div id="particles"></div>
      <div id="scan"></div>
      <div id="vignette"></div>
      <div id="kicker">PSYCOLLEGE</div>
      <div id="stage"></div>
      <div id="progress"><div id="progressfill"></div></div>
      <div id="handle">@psycollege</div>
    </div>
    <script>
      const WORDS = (window.SEG00_WORDS || []).map(([t, a, b]) => ({ t, a, b }));
      const TAIL = 0.8;
      const DURATION = (WORDS.length ? WORDS[WORDS.length - 1].b : 1) + TAIL;

      // deterministic particles
      function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      const rnd = mulberry32(20260608);
      const pHost = document.getElementById("particles");
      for (let i = 0; i < 60; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = (rnd() * 1080).toFixed(1) + "px";
        p.style.top = (rnd() * 1920).toFixed(1) + "px";
        p.style.transform = "scale(" + (0.5 + rnd() * 1.6).toFixed(2) + ")";
        p.dataset.drift = (rnd() * 2 - 1).toFixed(3);
        pHost.appendChild(p);
      }

      // group words into short phrase chunks (<=4 words, break on sentence/comma)
      function buildChunks(words) {
        const chunks = [];
        let cur = [];
        const flush = () => { if (cur.length) { chunks.push(cur); cur = []; } };
        for (const w of words) {
          cur.push(w);
          const hard = /[.!?]$/.test(w.t);
          const soft = /[,;:]$/.test(w.t);
          if (hard || (soft && cur.length >= 3) || cur.length >= 4) flush();
        }
        flush();
        return chunks;
      }

      const chunks = buildChunks(WORDS);
      const stage = document.getElementById("stage");
      const chunkEls = chunks.map((words, ci) => {
        const el = document.createElement("div");
        el.className = "chunk";
        words.forEach((w, wi) => {
          const span = document.createElement("span");
          span.className = "w" + (ci === 0 ? " lead" : "");
          span.textContent = w.t;
          span._word = w;
          el.appendChild(span);
        });
        stage.appendChild(el);
        return el;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // background drift + cold->warm shift
      gsap.utils.toArray(".particle").forEach((p) => {
        const d = parseFloat(p.dataset.drift) || 0;
        tl.to(p, { y: "+=" + (d * 60), duration: DURATION, ease: "sine.inOut" }, 0);
      });
      tl.fromTo("#glow", { opacity: 0.9, scale: 1 }, { opacity: 0.5, scale: 1.15, duration: DURATION, ease: "none" }, 0);
      // warm bloom over the final third (the "realer contact / send this" payoff)
      const warmStart = DURATION * 0.66;
      tl.to("#warmglow", { opacity: 0.0, duration: warmStart }, 0);
      tl.to("#warmglow", { opacity: 1, duration: DURATION - warmStart, ease: "power2.in" }, warmStart);
      tl.to("#kicker", { color: "#ffd9a0", duration: DURATION - warmStart, ease: "none" }, warmStart);

      // kicker in/out
      tl.fromTo("#kicker", { opacity: 0, y: -16 }, { opacity: 0.9, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.to("#kicker", { opacity: 0.35, duration: 0.6 }, 1.6);
      tl.fromTo("#handle", { opacity: 0 }, { opacity: 0.7, duration: 0.6 }, warmStart);

      // progress bar
      tl.fromTo("#progressfill", { width: "0%" }, { width: "100%", duration: DURATION, ease: "none" }, 0);

      // chunks: pop in at first word start, out at last word end (or next chunk start)
      chunks.forEach((words, ci) => {
        const el = chunkEls[ci];
        const start = words[0].a;
        const end = words[words.length - 1].b;
        const next = ci < chunks.length - 1 ? chunks[ci + 1][0].a : DURATION;
        const out = Math.min(next - 0.04, end + 0.18);
        tl.fromTo(el, { opacity: 0, y: 26, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "back.out(1.6)" }, Math.max(0, start - 0.08));
        tl.to(el, { opacity: 0, y: -18, scale: 0.98, duration: 0.22, ease: "power2.in" }, out);

        // per-word karaoke highlight (seek-safe: explicit on at start, off at end)
        words.forEach((w) => {
          const span = [...el.querySelectorAll(".w")].find((s) => s._word === w);
          tl.to(span, { color: "#f6f1e8", scale: 1.09, duration: 0.08, ease: "power2.out" }, w.a);
          tl.to(span, { color: "#9aa6b8", scale: 1.0, duration: 0.08, ease: "none" }, Math.max(w.a + 0.09, w.b));
        });
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
