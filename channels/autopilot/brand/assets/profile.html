<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; }
  #stage { width: 800px; height: 800px; background: #06080D; }
  svg { display: block; }
</style>
</head>
<body>
<div id="stage">
<!--
  psycollege — profile picture (P monogram, v3)
  A refined letter "P" sculpted from the channel's clay chibi character:
  the round face becomes the BOWL of the P, a clay stem forms the stroke,
  and the signature two dot-eyes sit inside the bowl so the character is
  still legible inside the letter. Same clay tone / dark world / bloom as the
  3D renders and brand-spec §8. One amber accent (the counter glow).
-->
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- brand bloom: cool base with a warm core so the clay reads warm against near-black -->
    <radialGradient id="bloom" cx="50%" cy="44%" r="58%">
      <stop offset="0%"  stop-color="#241B16" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#121A26" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06080D" stop-opacity="0"/>
    </radialGradient>

    <!-- clay material: key light upper-left, terminator to warm shadow.
         userSpaceOnUse so the lighting is continuous across stem + bowl. -->
    <radialGradient id="clay" cx="382" cy="300" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#F0CBA0"/>
      <stop offset="30%" stop-color="#E0B383"/>
      <stop offset="55%" stop-color="#CC9A68"/>
      <stop offset="76%" stop-color="#A9744A"/>
      <stop offset="92%" stop-color="#7C5234"/>
      <stop offset="100%" stop-color="#5E3D26"/>
    </radialGradient>
    <!-- cool bounce / rim on the lower-right (matches render fill light) -->
    <radialGradient id="rim" cx="600" cy="560" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#7E8CA0" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#7E8CA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="800" fill="#06080D"/>
  <circle cx="430" cy="380" r="450" fill="url(#bloom)"/>

  <!-- contact shadow under the P -->
  <ellipse cx="372" cy="690" rx="170" ry="38" fill="url(#contact)"/>

  <!-- ===== the "P" : clay stem + clay bowl (the character's head) =====
       stem top is tucked inside the bowl so the crown is one clean dome -->
  <!-- stem (left stroke; lower portion shows as the P's straight leg) -->
  <rect x="262" y="300" width="104" height="328" rx="52" fill="url(#clay)"/>
  <rect x="262" y="300" width="104" height="328" rx="52" fill="url(#rim)"/>
  <!-- bowl = the clay head -->
  <circle cx="452" cy="320" r="190" fill="url(#clay)"/>
  <circle cx="452" cy="320" r="190" fill="url(#rim)"/>

  <!-- ===== character face inside the bowl ===== -->
  <!-- two dot eyes (matte dark clay) -->
  <ellipse cx="406" cy="330" rx="25" ry="31" fill="#241710"/>
  <ellipse cx="502" cy="330" rx="25" ry="31" fill="#241710"/>
  <!-- faint upper sheen so the eyes read as rounded, not flat -->
  <ellipse cx="399" cy="317" rx="8"  ry="10" fill="#4A3322" opacity="0.55"/>
  <ellipse cx="495" cy="317" rx="8"  ry="10" fill="#4A3322" opacity="0.55"/>
  <!-- mouth: minimal gentle smile (matches the eyes' matte dark clay) -->
  <path d="M428 394 Q454 416 480 394" fill="none" stroke="#241710"
        stroke-width="10" stroke-linecap="round"/>
</svg>
</div>
</body>
</html>
