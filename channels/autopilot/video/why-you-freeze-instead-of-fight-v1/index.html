<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js",
          "roughjs": "https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.esm.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/lib/scene-kit.js"></script>
    <script src="assets/narration/seg-00-words.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0c10;
        font-family: "Helvetica Neue", Arial, sans-serif; }
      #main { position: absolute; inset: 0; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 86% 80% at 48% 50%, transparent 44%, rgba(0,0,0,0.5) 100%); }
      #caps { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        width: 1480px; text-align: center; pointer-events: none; }
      .phrase { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0;
        font-weight: 400; font-size: 46px; line-height: 1.4; letter-spacing: 0.01em;
        color: #5b6472; text-shadow: 0 2px 24px rgba(0,0,0,0.85); }
      .phrase .w { color: #5b6472; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="22">
      <audio id="vo" data-start="0" data-duration="22" data-track-index="9"
             src="assets/narration/seg-00.wav" data-volume="1"></audio>
      <canvas id="stage" class="clip" data-start="0" data-duration="22" data-track-index="0" width="1920" height="1080"></canvas>
      <div id="vignette"></div>
      <div id="caps" class="clip" data-start="0" data-duration="22" data-track-index="4"></div>
    </div>

    <script type="module">
      // seg-00 Hook — golden-hour field at dusk. Tall grass shears in a simplex
      // wind; a rabbit is the only still thing, heart hammering, while a hawk's
      // shadow slides across the grass. "You have done the exact same thing."
      import * as THREE from "three";
      import { makeBloomComposer, makeNoise, mulberry32 } from "./assets/lib/fx-kit.js";
      window.THREE = THREE;
      const SK = window.SceneKit;
      const V = THREE.Vector3;
      const END = 22;

      const canvas = document.getElementById("stage");
      const renderer = SK.makeRenderer(canvas);
      renderer.toneMappingExposure = 1.5;
      const scene = SK.makeScene(10, 30);
      scene.background = new THREE.Color(0x1b2330); // deep dusk blue

      // ---- ground (field) + warm horizon band (bloom-grazed) -----------------
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 44),
        new THREE.MeshStandardMaterial({ color: 0x2c3a30, roughness: 1 })
      );
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

      // low warm dusk sun band on the horizon — the only warmth, bloom halos it
      const horizon = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 7),
        new THREE.MeshBasicMaterial({ color: 0xd98a44, transparent: true, opacity: 0.85 })
      );
      horizon.position.set(0, 2.4, -15); scene.add(horizon);
      const sun = new THREE.Mesh(
        new THREE.CircleGeometry(1.5, 32),
        new THREE.MeshBasicMaterial({ color: 0xf0b25a })
      );
      sun.position.set(-3.5, 2.0, -14.8); scene.add(sun);

      // ---- grass: InstancedMesh of blades, swaying via simplex (the moving world) --
      const bladeGeo = new THREE.PlaneGeometry(0.05, 0.62);
      bladeGeo.translate(0, 0.31, 0); // pivot at the base so blades bend from the ground
      const bladeMat = new THREE.MeshStandardMaterial({
        color: 0x3c4d3a, roughness: 1, side: THREE.DoubleSide,
      });
      const GN = 1100;
      const grass = new THREE.InstancedMesh(bladeGeo, bladeMat, GN);
      grass.castShadow = true;
      const gb = new Float32Array(GN * 3); // base x, z, height-scale
      const grng = mulberry32(23);
      for (let i = 0; i < GN; i++) {
        const x = (grng() * 2 - 1) * 11;
        const z = -1 + (grng() * 2 - 1) * 6.5;
        gb[i * 3] = x; gb[i * 3 + 1] = z; gb[i * 3 + 2] = 0.7 + grng() * 0.9;
      }
      scene.add(grass);
      const dummy = new THREE.Object3D();
      const { noise2D } = makeNoise(5);

      // ---- the rabbit (the still subject) — body, head, ears, eye -------------
      const furMat = new THREE.MeshStandardMaterial({ color: 0x6b6258, roughness: 0.92 });
      const rabbit = new THREE.Group();
      rabbit.position.set(0.6, 0, 1.4);
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.34, 8, 16), furMat);
      body.rotation.z = Math.PI / 2; body.position.set(0, 0.28, 0); body.castShadow = true;
      rabbit.add(body);
      const rhead = new THREE.Group(); rhead.position.set(0.42, 0.42, 0); rabbit.add(rhead);
      const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 16), furMat);
      headMesh.castShadow = true; rhead.add(headMesh);
      function ear(side) {
        const e = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.34, 6, 10), furMat);
        e.position.set(-0.02, 0.32, side * 0.09); e.rotation.z = side * 0.12; e.castShadow = true;
        rhead.add(e);
      }
      ear(1); ear(-1);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0d0b0a, roughness: 0.3,
        emissive: 0x120a08, emissiveIntensity: 0.4 });
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.058, 12, 10), eyeMat);
      eye.position.set(0.16, 0.04, 0.12); rhead.add(eye);
      scene.add(rabbit);

      // ---- hawk shadow on the grass — a dark ellipse that slides across -------
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(1.15, 40),
        new THREE.MeshBasicMaterial({ color: 0x04060a, transparent: true, opacity: 0.0 })
      );
      shadow.rotation.x = -Math.PI / 2; shadow.scale.set(2.4, 0.95, 1);
      shadow.position.set(-9, 0.04, 1.3); scene.add(shadow);

      // ---- lights: low warm key from the dusk sun + cool ambient --------------
      const key = SK.makeKeyLight();
      key.position.set(-4.5, 2.6, -3.0); key.color.set(0xffb066); key.intensity = 1.5;
      scene.add(key);
      const ambient = new THREE.AmbientLight(0x4c5a70, 1.0); scene.add(ambient);
      scene.add(SK.makeFill(1.45));

      // ---- camera: 5 framings, <=4s holds ------------------------------------
      const rig = SK.makeCameraRig([
        { pos: new V(-4.0, 0.85, 5.4), posNear: new V(-2.6, 0.8, 4.6), look: new V(0.4, 0.5, 0.6) }, // 0 low WIDE across grass
        { pos: new V(1.4, 1.5, 3.0), look: new V(-1.5, 2.4, -12) },                                   // 1 over-rabbit to sky/horizon
        { pos: new V(1.55, 0.62, 2.5), posNear: new V(1.2, 0.6, 2.0), look: new V(0.78, 0.46, 1.4) }, // 2 MACRO rabbit eye/face
        { pos: new V(-3.0, 0.5, 3.4), look: new V(2.5, 0.2, 1.0) },                                   // 3 SHADOW sweeping the grass
        { pos: new V(2.6, 2.4, 5.2), posNear: new V(2.2, 2.0, 4.4), look: new V(0.2, 0.4, 0.8) },     // 4 PULL-BACK lone figure
      ], 40);
      const camera = rig.camera;

      const { composer, bloom } = makeBloomComposer(renderer, scene, camera,
        { strength: 0.7, radius: 0.6, threshold: 0.42 });

      // ---- single source of truth --------------------------------------------
      const proxy = { t: 0, panic: 0, cross: 0 }; // panic = heartbeat ramp, cross = shadow x progress
      function render() {
        // grass sway (pure function of t) — the world never stops moving
        for (let i = 0; i < GN; i++) {
          const x = gb[i * 3], z = gb[i * 3 + 1], h = gb[i * 3 + 2];
          const sway = 0.5 * noise2D(x * 0.28 + proxy.t * 0.55, z * 0.28);
          dummy.position.set(x, 0, z);
          dummy.rotation.set(0, 0, sway);
          dummy.scale.set(1, h, 1);
          dummy.updateMatrix();
          grass.setMatrixAt(i, dummy.matrix);
        }
        grass.instanceMatrix.needsUpdate = true;

        // rabbit heart hammering — fast tiny pulse, deeper once the shadow nears
        const amp = 0.012 + proxy.panic * 0.03;
        const freq = 7.0 + proxy.panic * 7.0;
        const beat = Math.sin(proxy.t * freq);
        body.scale.set(1 + amp * beat, 1 + amp * beat * 0.6, 1 + amp * beat);

        // hawk shadow glides across, darkening as it passes over the rabbit
        const sx = -9 + proxy.cross * 18;
        shadow.position.x = sx;
        const near = 1 - Math.min(1, Math.abs(sx - rabbit.position.x) / 7.0);
        shadow.material.opacity = 0.66 * near;

        bloom.strength = 0.6 + proxy.panic * 0.35;
        rig.apply();
        composer.render();
      }
      render();

      // ---- captions ----------------------------------------------------------
      const capHost = document.getElementById("caps");
      const phraseEls = SK.buildCaptions(window.seg00 || [], capHost);

      // ---- timeline ----------------------------------------------------------
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.to(proxy, { t: END, duration: END, ease: "none" }, 0);

      // the hawk shadow sweeps over the rabbit during the shadow framing (~t=7)
      tl.to(proxy, { cross: 1, duration: 7.5, ease: "none" }, 4.0);
      // gear-change: heart locks into a hammer as the shadow arrives (~ "does not run")
      tl.to(proxy, { panic: 1, duration: 1.3, ease: "power2.in" }, 7.2);

      // camera cuts (<=4s); 0 WIDE · 1 SKY · 2 EYE · 3 SHADOW · 4 PULL-BACK
      const cut = SK.makeCutter(tl, rig.state);
      cut.auto(0.0, 4.6, 2.3, [0, 4], true);        // a rabbit caught in an open field at dusk
      cut.auto(4.6, 11.0, 3.2, [3, 2, 1], true);    // a hawk's shadow crosses, the rabbit does not run
      cut.auto(11.0, 16.0, 2.5, [2, 0], true);      // it locks rigid, heart hammering
      cut.auto(16.0, END, 3.0, [4, 0, 2], true);    // you have done the exact same thing

      SK.wireCaptions(tl, phraseEls, END);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
