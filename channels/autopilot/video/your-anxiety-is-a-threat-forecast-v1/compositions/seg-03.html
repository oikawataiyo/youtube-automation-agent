<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js",
          "roughjs": "https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.esm.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../assets/lib/scene-kit.js"></script>
    <script src="../assets/narration/seg-03-words.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #12161c;
        font-family: "Helvetica Neue", Arial, sans-serif; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 88% 82% at 50% 48%, transparent 46%, rgba(0,0,0,0.42) 100%); }
      #caps { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
        width: 1480px; text-align: center; pointer-events: none; }
      .phrase { position: absolute; left: 0; right: 0; bottom: 0; opacity: 0;
        font-weight: 400; font-size: 46px; line-height: 1.4; letter-spacing: 0.01em;
        color: #5b6472; text-shadow: 0 2px 24px rgba(0,0,0,0.85); }
      .phrase .w { color: #5b6472; }
    </style>
  </head>
  <body>
    <div id="seg03" data-composition-id="seg03" data-width="1920" data-height="1080" data-start="0" data-duration="132">
      <audio id="vo" data-start="0" data-duration="132" data-track-index="9"
             src="../assets/narration/seg-03.wav" data-volume="1"></audio>
      <canvas id="stage" class="clip" data-start="0" data-duration="132" data-track-index="0" width="1920" height="1080"></canvas>
      <div id="vignette"></div>
      <div id="caps" class="clip" data-start="0" data-duration="132" data-track-index="4"></div>
    </div>

    <script type="module">
      // seg-03 HERO — a transparent body; a simplex flow-field of weather/storm
      // particles flows through chest and stomach, then breaks OUTWARD into a
      // storm as the prediction becomes the evidence (interoceptive loop).
      import * as THREE from "three";
      import { makeBloomComposer, makeNoise, mulberry32 } from "../assets/lib/fx-kit.js";
      window.THREE = THREE;
      const SK = window.SceneKit;
      const V = THREE.Vector3;
      const END = 132;

      const canvas = document.getElementById("stage");
      const renderer = SK.makeRenderer(canvas);
      renderer.toneMappingExposure = 1.5;
      const scene = SK.makeScene(12, 34);
      scene.background = new THREE.Color(0x12161c);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
        new THREE.MeshStandardMaterial({ color: 0x333b47, roughness: 0.98 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 16),
        new THREE.MeshStandardMaterial({ color: 0x232b34, roughness: 1 }));
      backWall.position.set(0, 8, -6); scene.add(backWall);

      // ---- transparent body shell (torso + head) — see the storm inside ------
      const shellMat = new THREE.MeshStandardMaterial({
        color: 0x9fb6cc, roughness: 0.4, metalness: 0.1,
        transparent: true, opacity: 0.16, depthWrite: false,
      });
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.46, 0.7, 8, 18), shellMat);
      torso.position.set(0, 1.35, 0); scene.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 18), shellMat);
      head.position.set(0, 2.05, 0); scene.add(head);

      // ---- simplex flow-field particles (the body-weather) -------------------
      const N = 1500;
      const base = new Float32Array(N * 3);
      const rng = mulberry32(99);
      for (let i = 0; i < N; i++) {
        const y = 0.85 + rng() * 1.35;                 // torso..head column
        const maxr = (y > 1.75 ? 0.3 : 0.46) * Math.sqrt(rng());
        const a = rng() * Math.PI * 2;
        base[i * 3] = Math.cos(a) * maxr;
        base[i * 3 + 1] = y;
        base[i * 3 + 2] = Math.sin(a) * maxr * 0.7;     // flatten depth
      }
      const pos = new Float32Array(base);               // working positions
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const pMat = new THREE.PointsMaterial({
        color: 0x9fc6ff, size: 0.05, sizeAttenuation: true,
        transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending,
      });
      const points = new THREE.Points(geo, pMat);
      scene.add(points);
      const { noise3D } = makeNoise(7);

      // ---- lights (cold) ------------------------------------------------------
      const key = SK.makeKeyLight(); key.position.set(-1.6, 4.2, 2.4); key.intensity = 0.9; scene.add(key);
      scene.add(new THREE.AmbientLight(0x4a586c, 1.0));
      scene.add(SK.makeFill(1.35));

      const rig = SK.makeCameraRig([
        { pos: new V(0.0, 1.55, 4.3), posNear: new V(0.0, 1.5, 3.4), look: new V(0, 1.4, 0) },     // 0 full body front
        { pos: new V(0.9, 1.9, 2.1), posNear: new V(0.5, 1.85, 1.6), look: new V(0, 1.62, 0) },    // 1 chest close
        { pos: new V(0.8, 1.15, 2.1), posNear: new V(0.4, 1.1, 1.6), look: new V(0, 1.08, 0) },    // 2 stomach close
        { pos: new V(0.0, 1.7, 6.0), posNear: new V(0.0, 1.65, 4.6), look: new V(0, 1.4, 0) },     // 3 storm breaks out (wide)
        { pos: new V(2.8, 1.45, 2.6), look: new V(0, 1.4, 0) },                                     // 4 silhouette side
      ], 40);
      const camera = rig.camera;

      const { composer, bloom } = makeBloomComposer(renderer, scene, camera,
        { strength: 0.8, radius: 0.65, threshold: 0.0 });

      // ---- flow (pure function of t → seek-safe) -----------------------------
      const proxy = { t: 0, storm: 0 };
      const cx = 0, cy = 1.4, cz = 0;
      function render() {
        const f = 0.7;
        const amp = 0.14 + proxy.storm * 0.28;
        const out = proxy.storm * 1.5;
        const tt = proxy.t * 0.5;
        for (let i = 0; i < N; i++) {
          const bx = base[i * 3], by = base[i * 3 + 1], bz = base[i * 3 + 2];
          const nx = noise3D(bx * f + tt, by * f, bz * f);
          const ny = noise3D(bx * f, by * f + tt, bz * f + 5.0);
          const nz = noise3D(bx * f, by * f, bz * f + tt + 10.0);
          pos[i * 3]     = bx + amp * nx + (bx - cx) * out;
          pos[i * 3 + 1] = by + amp * ny + (by - cy) * out;
          pos[i * 3 + 2] = bz + amp * nz + (bz - cz) * out;
        }
        geo.attributes.position.needsUpdate = true;
        bloom.strength = 0.75 + proxy.storm * 0.5;
        rig.apply();
        composer.render();
      }
      render();

      const capHost = document.getElementById("caps");
      const phraseEls = SK.buildCaptions(window.seg03 || [], capHost);

      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.to(proxy, { t: END, duration: END, ease: "none" }, 0);
      // weather flows inside the body early; the storm breaks outward later
      tl.to(proxy, { storm: 0.25, duration: 30, ease: "sine.inOut" }, 30);
      tl.to(proxy, { storm: 0.85, duration: 38, ease: "power2.in" }, 78);
      tl.to(proxy, { storm: 0.55, duration: 18, ease: "sine.inOut" }, 116);

      const cut = SK.makeCutter(tl, rig.state);
      cut.auto(0.0, 30, 3.8, [0, 1, 4], true);     // brain predicts the body's interior
      cut.auto(30, 74, 3.6, [1, 2, 0, 4], true);   // chest flutter / stomach become evidence
      cut.auto(74, 116, 3.6, [3, 0, 1, 2], true);  // the storm breaks outward
      cut.auto(116, END, 4.0, [0, 4, 3], true);    // prediction made flesh

      SK.wireCaptions(tl, phraseEls, END);
      window.__timelines = window.__timelines || {};
      window.__timelines["seg03"] = tl;
    </script>
  </body>
</html>
